[project]
name = "jarvis-assistant"
version = "0.9.0"
description = "JARVIS - a local-first personal AI assistant for Windows"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Proprietary" }

# Core runtime: chat, tools, memory, API server. Lower bounds are the versions the test suite
# currently runs against; exact versions are pinned in uv.lock.
dependencies = [
    "google-genai>=2.10.0",
    "httpx>=0.28.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.7.0",
    "python-multipart>=0.0.12",
    "PyJWT>=2.9.0",
    "bcrypt>=4.2.0",
    "cryptography>=43.0.0",
    "chromadb>=1.5.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "ddgs>=9.16.0",
    "pypdf>=5.0.0",
    "python-docx>=1.0.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
    "psutil>=6.0.0",
    "pyperclip>=1.9.0",
    "PyAutoGUI>=0.9.54",
    "PyGetWindow>=0.0.9",
    "Pillow>=11.0.0",
    # Windows desktop integration (credential vault, UI Automation, Office COM)
    "pywin32>=306; sys_platform == 'win32'",
    "pywinauto>=0.6.8; sys_platform == 'win32'",
    "comtypes>=1.4.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Browser automation (also run: playwright install chromium)
browser = ["playwright>=1.47.0"]
# Voice in/out. Wake word needs a Picovoice key; push-to-talk works without it.
voice = [
    "SpeechRecognition>=3.10.0",
    "pyttsx3>=2.90",
    "PyAudio>=0.2.14",
    "edge-tts>=7.0.0",
    "pydub>=0.25.1",
    "sounddevice>=0.5.0",
    "numpy>=1.26",
    "keyboard>=0.13.5",
    "pvporcupine>=3.0.0",
]
# Offline speech-to-text (large download: faster-whisper model + torch for VAD)
local-stt = ["faster-whisper>=1.0.0", "torch>=2.4.0"]
# Screen OCR on Windows
ocr = ["winocr>=0.0.15; sys_platform == 'win32'"]
# Premium neural voice
elevenlabs = ["elevenlabs>=1.9.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[tool.uv]
package = false
# Test configuration lives in pytest.ini.
