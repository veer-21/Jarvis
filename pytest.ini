[pytest]
testpaths = tests
norecursedirs = backup_snapshot venv .git node_modules desktop dist build
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
markers =
    desktop: tests requiring active desktop or display environment
    integration: integration tests
    slow: long-running tests
